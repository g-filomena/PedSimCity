name: GitHub CI

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Standard Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: g-filomena
          server-password: ${{ secrets.G_TOKEN }}
            
      - name: Publish package
        run: mvn clean deploy --settings $GITHUB_WORKSPACE/.m2/settings.xml
        env:
          GITHUB_USER: g-filomena
          GITHUB_TOKEN: ${{ secrets.G_TOKEN }}