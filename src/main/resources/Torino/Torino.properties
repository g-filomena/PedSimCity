# PedSimCity — city parameters for Torino.
#
# THIS FILE CONFIGURES THE ACTIVITY MODEL, AND NOTHING ELSE. Every key below is an ActivityPars
# field. Loaded by pedsim.activity.parameters.CityConfig before the command line, so anything here
# can be overridden with --key=value for a sweep.
#
# Core parameters do not belong here and are not accepted. Core is the machinery — graph, routing,
# cognitive map, movement, the day loop — and has no behaviour to configure; a city is a set of
# behavioural facts, which is an activity-model idea. Things like Pars.minRouteLength and
# Pars.networkCircuityFactor are therefore set on the command line or measured from the network, not
# stated here.
#
# Model constants (explorationRho, familiarLocationCapacity, the destination-search convergence
# controls) are not settable either: they are properties of the model or of human mobility in
# general, not of a place. Run switches (useDestinationChoice, useWeather, calibrateCommute, seed,
# jobs, parallel) are refused with a warning — they choose a model or an experiment, and a city file
# that set one would make two cities differ in mechanism while appearing to differ in geography.
#
# Every key is reported in the log as applied, refused, or unplaced. A misspelling is a warning, not
# a silent default.

# ---------------------------------------------------------------------------
# Mode and participation
# ---------------------------------------------------------------------------
# ISTAT, Matrice del pendolarismo, 15th census (2011), restricted to residents of Torino whose
# workplace or place of study is in Torino — the only commute this model represents. 233,399
# intra-Turin work commutes, 16.3% on foot; 121,512 study commutes, 38.0%. See COMMUTE_DISTANCE.md.
# These are the check, not an input: ActivityTravelDemand.prepare logs the realised share against
# them once per simulated day.
walkShareCommuteWorker  = 0.163
walkShareCommuteStudent = 0.380

# Logit curves fitted to the two shares above plus the four-band walked-commute length distribution
# (CommuteCalibration). Half-distance in metres, steepness per metre.
walkShareCommuteHalfDistance = 800.0
walkShareCommuteSteepness    = 0.0015
walkShareStudentHalfDistance = 1200.0
walkShareStudentSteepness    = 0.0019

# ISFORT: 2.53 trips/day for the mobile 80.8% of the population -> 2.04 per resident across all
# modes. A count of *legs*, every mode; how many are walked is decided per trip once the destination
# is known, and the ~25% walking share of a large north-western city is what the run is checked
# against rather than what it is told. The chain length is the model's own and is not baked in here.
tripsPerPersonPerDay = 2.04

# Persona mix. Superseded per census section wherever the census carries the columns (P101 and the
# age bands); this is the fallback for zones that do not. Torino's own aggregate over 6,775
# sections and 846,567 residents, on one denominator — the zone's 15+ adults.
workerShare  = 0.463
studentShare = 0.099
retireeShare = 0.293
flexShare    = 0.145

# ---------------------------------------------------------------------------
# Willingness to walk, and distance decay
# ---------------------------------------------------------------------------
# Fitted to ISTAT together with the commute curves above. Both were fitted, so neither is an
# independent check on the other — see NEXT.md.
workplaceDistanceDecay     = 1.0
workplaceMinDistanceMetres = 0.0
educationDistanceDecay     = 1.5

# Destination-choice utility: U(j) = sizeWeight*ln(1+attraction) - distanceWeight*metres
#                                   + habitWeight*known
# distanceWeight is the single largest uncalibrated quantity in the model: it *is* the discretionary
# trip-length distribution. Calibrating it needs an observed distribution (Audimob microdata).
sizeWeight     = 1.0
distanceWeight = 0.0012
habitWeight    = 1.5

# Choice-set radius, metres. Measured convergence: 1,500 m gives a 1,103 m mean leg, 3,000 m gives
# 1,384 m, 6,000 m gives 1,438 m, 12,000 m gives 1,371 m. The current value truncates the mean by
# about 4%; raise it to 6000 if you want the javadoc's claim that it bounds the work rather than the
# behaviour to be true.
choiceSetRadiusMetres = 3000.0

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# Where Turin is is measured from the street network at startup (CityLocation), so there is no
# latitude here. What geometry cannot say is which clocks the city keeps: zone boundaries are
# political, and without this the summer evening arrives an hour early.
timeZoneId = Europe/Rome

rainyDayProbability         = 0.25
rainReleaseMultiplier       = 0.75
rainDiscretionaryMultiplier = 0.6

# POI/attraction geometry
poiClaimRadius               = 300.0
buildingAreaPerAttractionUnit = 200.0


# ---------------------------------------------------------------------------
# Discretionary purpose mix, per persona
# ---------------------------------------------------------------------------
# persona.<PERSONA>.<PURPOSE> — the relative weight of that purpose for that persona.
# Personas: WORKER, STUDENT, RETIREE, FLEX.
# Purposes: SHOPPING, ERRANDS, DINING, NIGHTLIFE, LEISURE, STROLL.
#
# NOT SOURCED. These are placeholders, adjusted from the Java defaults towards Italian practice by
# judgement alone — no survey stands behind any of them. What belongs here is ISFORT's purpose split
# for *walking* trips: every discretionary trip this model produces is walked, so these weights are
# the purpose mix of walked trips, not of all trips. A time-use split would be the wrong quantity,
# since it counts activities regardless of how people got there.
#
# ISFORT publishes one national row, not four personas, so even once sourced the differences between
# the rows below stay invented.
#
# A key left out keeps the Java default, so a partial block is meaningful. The realised mix is
# logged at the end of each simulated day — it is not this table, because the opening windows
# renormalise the weights at every draw.

persona.WORKER.SHOPPING    = 0.22
persona.WORKER.ERRANDS     = 0.13
persona.WORKER.DINING      = 0.24
persona.WORKER.NIGHTLIFE   = 0.12
persona.WORKER.LEISURE     = 0.22
persona.WORKER.STROLL      = 0.07

persona.STUDENT.SHOPPING   = 0.13
persona.STUDENT.ERRANDS    = 0.04
persona.STUDENT.DINING     = 0.22
persona.STUDENT.NIGHTLIFE  = 0.24
persona.STUDENT.LEISURE    = 0.27
persona.STUDENT.STROLL     = 0.10

persona.RETIREE.SHOPPING   = 0.28
persona.RETIREE.ERRANDS    = 0.28
persona.RETIREE.DINING     = 0.06
persona.RETIREE.NIGHTLIFE  = 0.00
persona.RETIREE.LEISURE    = 0.16
persona.RETIREE.STROLL     = 0.22

persona.FLEX.SHOPPING      = 0.24
persona.FLEX.ERRANDS       = 0.14
persona.FLEX.DINING        = 0.18
persona.FLEX.NIGHTLIFE     = 0.11
persona.FLEX.LEISURE       = 0.22
persona.FLEX.STROLL        = 0.11

# ---------------------------------------------------------------------------
# Opening windows and stay durations, per activity purpose
# ---------------------------------------------------------------------------
# purpose.<NAME>.open / .close  — hours of the day; a close before an open wraps past midnight
# purpose.<NAME>.stayMinutes    — mean of the lognormal stay
# purpose.<NAME>.staySigma      — its log sigma
#
# Purposes: WORK, EDUCATION, SHOPPING, ERRANDS, DINING, NIGHTLIFE, LEISURE, STROLL.
#
# DELIBERATELY EMPTY. The 32 numbers on ActivityPurpose are invented and city-blind — the enum says
# dining runs 11:00–23:00 everywhere, which is not an Italian day — and filling them in here with
# equally invented Italian-sounding hours would only move the invention somewhere that looks
# sourced. What belongs here is either an aggregation of the OSM `opening_hours` tags for Turin or a
# local retail/hospitality schedule. Until one of those exists the enum defaults stand, and they are
# the thing to cite.
#
# The OSM route is one column away, not a data-collection project: `pipeline/00_city_preparation.py`
# already downloads every POI with its full tag set and then keeps only POI_TAG_COLUMNS — amenity,
# shop, leisure, tourism, sport, office. Add `opening_hours` there, re-run `--stages pois`, and the
# tag is in `<City>_POIs.gpkg` to be aggregated per purpose. It is patchy and free-text, so the
# aggregation is real work; the download is not.
#
# The mechanism works: uncomment and the value is applied and logged like any other city parameter.
# purpose.DINING.open        = 12.0
# purpose.DINING.close       = 23.0
# purpose.DINING.stayMinutes = 75
# purpose.SHOPPING.open      = 9.0
# purpose.SHOPPING.close     = 19.5
