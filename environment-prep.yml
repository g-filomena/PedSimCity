# Conda environment for the city-preparation pipeline (pipeline/00_city_preparation.py).
# Heavier than the census environment: it needs cityImage plus its optional extras for
# centrality (igraph), regions (python-louvain) and 3D sight lines (pyvista, dask).
# cityImage itself is installed from PyPI by build_city.bat.
name: pedsimcity-prep
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - osmnx>=2
  - geopandas
  - pandas
  - numpy
  - scipy
  - networkx
  - pyogrio
  - shapely>=2
  - python-igraph
  - python-louvain
  - pyvista
  - dask
  - psutil
  - tqdm
  - rasterio
  - rasterstats
  - pip
