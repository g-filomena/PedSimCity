<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PedSimCity Web Dashboard</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg-dark: #0f111a;
      --glass-bg: rgba(20, 24, 39, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --glow: rgba(99, 102, 241, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      background-image: radial-gradient(circle at top right, rgba(99,102,241,0.1), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(16,185,129,0.05), transparent 40%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-panel:hover {
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 20px var(--glow);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px var(--accent);
    }

    button:active {
      transform: translateY(0);
    }

    /* Status Panel */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-card.wide {
      grid-column: span 2;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--success);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Terminal Log */
    .terminal {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 1rem;
      height: 200px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .terminal-line {
      margin-bottom: 0.4rem;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      padding-bottom: 0.2rem;
    }

    .terminal-time {
      color: var(--accent);
      margin-right: 0.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Configuration Panel -->
    <div class="glass-panel">
      <h1>Simulation Setup</h1>
      <p class="subtitle">Configure parameters and dispatch the REST payload.</p>

      <div class="form-group">
        <label for="cityName">Target City</label>
        <select id="cityName">
          <option value="Torino">Torino (Default)</option>
          <option value="Muenster">Muenster</option>
          <option value="TorinoCentre">TorinoCentre</option>
        </select>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="actualPopulation">Population</label>
          <input type="number" id="actualPopulation" value="1000" min="1"/>
        </div>
        <div class="form-group">
          <label for="percentage">Agent Fraction (%)</label>
          <input type="number" id="percentage" value="0.01" step="0.01" min="0.01"/>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="days">Duration (Days)</label>
          <input type="number" id="days" value="1" min="1"/>
        </div>
        <div class="form-group">
          <label for="jobs">Parallel Jobs</label>
          <input type="number" id="jobs" value="1" min="1"/>
        </div>
      </div>

      <button id="startBtn" onclick="startSimulation()">Launch Simulation</button>
    </div>

    <!-- Live Status Panel -->
    <div class="glass-panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Live Telemetry</h1>
        <div class="status-badge offline" id="statusPill">
          <div class="dot"></div>
          <span id="statusText">Offline</span>
        </div>
      </div>
      <p class="subtitle">Real-time statistics fetched from /api/state</p>

      <div class="stats-grid">
        <div class="stat-card wide">
          <div class="value" id="val-time">00:00:00</div>
          <div class="label">Simulation Clock</div>
        </div>
        <div class="stat-card">
          <div class="value" id="val-step">0</div>
          <div class="label">Current Step</div>
        </div>
        <div class="stat-card">
          <div class="value" style="color: var(--success);" id="val-walking">0</div>
          <div class="label">Walking Agents</div>
        </div>
        <div class="stat-card">
          <div class="value" id="val-home">0</div>
          <div class="label">At Home</div>
        </div>
        <div class="stat-card">
          <div class="value" id="val-dest">0</div>
          <div class="label">At Destination</div>
        </div>
      </div>

      <div class="terminal" id="terminalLog">
        <div class="terminal-line"><span class="terminal-time">SYS</span> Waiting for simulation start...</div>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = 'http://localhost:8081';
    let pollInterval = null;

    function log(msg) {
      const el = document.getElementById('terminalLog');
      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = 'terminal-line';
      line.innerHTML = `<span class="terminal-time">${time}</span> ${msg}`;
      el.prepend(line);
      if (el.children.length > 50) el.removeChild(el.lastChild);
    }

    async function startSimulation() {
      const payload = {
        cityName: document.getElementById('cityName').value,
        actualPopulation: parseInt(document.getElementById('actualPopulation').value),
        percentage: parseFloat(document.getElementById('percentage').value),
        days: parseInt(document.getElementById('days').value),
        jobs: parseInt(document.getElementById('jobs').value)
      };

      const btn = document.getElementById('startBtn');
      btn.textContent = 'Launching...';
      btn.disabled = true;

      try {
        const resp = await fetch(`${API_BASE}/api/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (resp.ok) {
          log('Engine successfully accepted start payload.');
          btn.textContent = 'Simulation Running';
          btn.style.background = 'var(--success)';
          beginPolling();
        } else {
          throw new Error(`Server rejected request: ${resp.status}`);
        }
      } catch (err) {
        log(`Error: ${err.message}`);
        btn.textContent = 'Launch Failed (Retry)';
        btn.disabled = false;
      }
    }

    function beginPolling() {
      if (pollInterval) return;
      log('Connecting to telemetry stream...');
      pollInterval = setInterval(fetchState, 1500);
      fetchState();
    }

    async function fetchState() {
      try {
        const resp = await fetch(`${API_BASE}/api/state`, { signal: AbortSignal.timeout(1000) });
        if (!resp.ok) throw new Error('Bad response');
        const data = await resp.json();
        
        // Update UI
        document.getElementById('statusPill').className = 'status-badge';
        document.getElementById('statusText').textContent = 'Live';

        document.getElementById('val-time').textContent = data.simulationTime || '00:00:00';
        document.getElementById('val-step').textContent = data.currentStep || 0;
        document.getElementById('val-walking').textContent = data.walkingCount || 0;
        document.getElementById('val-home').textContent = data.atHomeCount || 0;
        document.getElementById('val-dest').textContent = data.atDestCount || 0;

      } catch (err) {
        document.getElementById('statusPill').className = 'status-badge offline';
        document.getElementById('statusText').textContent = 'Disconnected';
      }
    }
  </script>

</body>
</html>
