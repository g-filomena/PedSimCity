<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PedSimCity Live Dashboard</title>
  <meta name="description" content="Live pedestrian simulation dashboard for PedSimCity showing agent positions on a Leaflet map."/>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0c14;
      --surface:  #111422;
      --border:   #1e2235;
      --accent:   #6366f1;
      --accent2:  #818cf8;
      --danger:   #ef4444;
      --safe:     #3b82f6;
      --muted:    #64748b;
      --text:     #e2e8f0;
      --textdim:  #94a3b8;
      --success:  #22c55e;
      --warning:  #f59e0b;
      --sidebar-w: 300px;
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }

    /* ── Layout ──────────────────────────────────────────────── */
    #layout { display: flex; height: 100vh; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar-header {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      font-size: 15px; font-weight: 700; color: var(--text);
      letter-spacing: 0.01em;
    }
    .sidebar-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px; padding: 4px 10px;
      border-radius: 999px; font-size: 11px; font-weight: 600;
      background: rgba(99,102,241,0.12); color: var(--accent2);
      border: 1px solid rgba(99,102,241,0.25);
    }
    .status-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .status-pill.offline .dot { background: var(--muted); box-shadow: none; animation: none; }
    .status-pill.offline { color: var(--muted); border-color: var(--border); background: transparent; }

    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    /* ── Stat cards ──────────────────────────────────────────── */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; padding: 14px;
    }
    .stat-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .stat-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .stat-card .value { font-size: 20px; font-weight: 700; color: var(--text); margin-top: 2px; line-height: 1; }
    .stat-card.wide { grid-column: span 2; }
    .stat-card .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── Section headers ─────────────────────────────────────── */
    .section-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--muted);
      padding: 10px 14px 4px;
      border-top: 1px solid var(--border);
    }

    /* ── Controls ────────────────────────────────────────────── */
    .controls { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
    label.ctrl { font-size: 11px; color: var(--textdim); display: flex; flex-direction: column; gap: 4px; }
    label.ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
    label.ctrl .ctrl-row { display: flex; justify-content: space-between; }
    label.ctrl .ctrl-val { font-size: 11px; font-weight: 600; color: var(--text); }

    /* Toggle switch */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--textdim); }
    .toggle { position: relative; width: 34px; height: 18px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider-track {
      position: absolute; inset: 0; border-radius: 999px;
      background: var(--border); cursor: pointer; transition: background .2s;
    }
    .slider-track::before {
      content: ''; position: absolute; width: 12px; height: 12px; border-radius: 50%;
      top: 3px; left: 3px; background: var(--textdim); transition: transform .2s, background .2s;
    }
    input:checked + .slider-track { background: var(--accent); }
    input:checked + .slider-track::before { transform: translateX(16px); background: #fff; }

    /* ── Legend ──────────────────────────────────────────────── */
    .legend { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--textdim); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── Log ─────────────────────────────────────────────────── */
    #log { 
      flex: 1; overflow-y: auto; padding: 8px 14px;
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      color: var(--muted); border-top: 1px solid var(--border);
    }
    .log-line { border-bottom: 1px solid rgba(255,255,255,0.03); padding: 2px 0; }
    .log-time { color: var(--accent2); margin-right: 6px; }

    /* ── Map ─────────────────────────────────────────────────── */
    #map { flex: 1; background: #08090f; }

    /* Leaflet dark theme tweaks */
    .leaflet-container { background: #08090f !important; }
    .leaflet-control-attribution { display: none !important; }
    .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .leaflet-control-zoom a:hover { background: var(--border) !important; }

    /* ── Error banner ────────────────────────────────────────── */
    #error-banner {
      display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5; border-radius: 8px; padding: 8px 16px; font-size: 12px; white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="layout">
  <!-- ── Sidebar ─────────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>PedSimCity Dashboard</h1>
      <p>Live agent tracking via REST API</p>
      <div class="status-pill offline" id="status-pill">
        <span class="dot"></span>
        <span id="status-text">Connecting…</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card wide">
        <div class="label">Simulation Time</div>
        <div class="value" id="s-time">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Step</div>
        <div class="value" id="s-step">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Walking</div>
        <div class="value" id="s-walking" style="color:var(--safe)">0</div>
      </div>
      <div class="stat-card">
        <div class="label">At Home</div>
        <div class="value" id="s-home">0</div>
      </div>
      <div class="stat-card">
        <div class="label">At Dest.</div>
        <div class="value" id="s-dest">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Agents</div>
        <div class="value" id="s-total">0</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="section-title">View Controls</div>
    <div class="controls">
      <label class="ctrl">
        <div class="ctrl-row">
          <span>Refresh rate</span>
          <span class="ctrl-val"><span id="rate-val">2</span>s</span>
        </div>
        <input type="range" id="rate-slider" min="0.5" max="10" step="0.5" value="2"/>
      </label>

      <div class="toggle-row">
        <span>Show roads</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-roads" checked/>
          <span class="slider-track"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>Show agents</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-agents" checked/>
          <span class="slider-track"></span>
        </label>
      </div>
    </div>

    <!-- Legend -->
    <div class="section-title">Legend</div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> Normal Agent</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Vulnerable Agent</div>
      <div class="legend-item"><div class="legend-dot" style="background:#475569;border-radius:0;height:2px;width:20px"></div> Road network</div>
    </div>

    <!-- Log -->
    <div class="section-title">Activity Log</div>
    <div id="log"></div>
  </aside>

  <!-- ── Map ──────────────────────────────────────────── -->
  <div style="position:relative;flex:1;">
    <div id="map"></div>
    <div id="error-banner">⚠ Cannot reach simulation API at port 8081</div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Config ─────────────────────────────────────────────────────────────────
const API_BASE  = 'http://localhost:8081';
const STATE_URL = API_BASE + '/api/state';
const ROADS_URL = API_BASE + '/api/roads';

// ── Map init ────────────────────────────────────────────────────────────────
const map = L.map('map', {
  zoomControl: true,
  preferCanvas: true   // canvas renderer is much faster for many markers
});

// Dark-toned tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 20
}).addTo(map);

// ── Layers ─────────────────────────────────────────────────────────────────
let roadsLayer   = null;
let roadsLoaded  = false;
let agentLayer   = L.layerGroup().addTo(map);

// ── DOM refs ───────────────────────────────────────────────────────────────
const pill       = document.getElementById('status-pill');
const pillText   = document.getElementById('status-text');
const errBanner  = document.getElementById('error-banner');
const logEl      = document.getElementById('log');
const rateSlider = document.getElementById('rate-slider');
const rateVal    = document.getElementById('rate-val');

// ── UI controls ─────────────────────────────────────────────────────────────
rateSlider.addEventListener('input', () => {
  rateVal.textContent = rateSlider.value;
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, parseFloat(rateSlider.value) * 1000);
});

document.getElementById('toggle-roads').addEventListener('change', e => {
  if (!roadsLayer) return;
  if (e.target.checked) map.addLayer(roadsLayer);
  else map.removeLayer(roadsLayer);
});

document.getElementById('toggle-agents').addEventListener('change', e => {
  if (e.target.checked) map.addLayer(agentLayer);
  else map.removeLayer(agentLayer);
});

// ── Logging ──────────────────────────────────────────────────────────────────
function addLog(msg) {
  const now  = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="log-time">${now}</span>${msg}`;
  logEl.prepend(line);
  // Keep log short
  while (logEl.children.length > 50) logEl.removeChild(logEl.lastChild);
}

// ── Status pill ──────────────────────────────────────────────────────────────
function setOnline() {
  pill.className = 'status-pill';
  pillText.textContent = 'Connected';
  errBanner.style.display = 'none';
}
function setOffline(msg) {
  pill.className = 'status-pill offline';
  pillText.textContent = 'Offline';
  errBanner.style.display = 'block';
}

// ── Load roads once ───────────────────────────────────────────────────────────
async function loadRoads() {
  if (roadsLoaded) return;
  try {
    const resp = await fetch(ROADS_URL);
    if (!resp.ok) return;
    const gj = await resp.json();
    if (!gj.features || gj.features.length === 0) return;

    roadsLayer = L.geoJSON(gj, {
      style: { color: '#334155', weight: 1.2, opacity: 0.7 }
    }).addTo(map);

    // Fit map to roads on first load
    map.fitBounds(roadsLayer.getBounds(), { padding: [20, 20] });
    roadsLoaded = true;
    addLog(`Road network loaded (${gj.features.length} segments)`);
  } catch (e) {
    // Roads not ready yet — will retry next poll
  }
}

// ── Reusable circle icon factory (fast, no DOM creation per agent) ────────────
function circleIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:8px;height:8px;border-radius:50%;background:${color};opacity:0.85;"></div>`,
    iconSize: [8, 8],
    iconAnchor: [4, 4]
  });
}
const iconNormal = circleIcon('#3b82f6');
const iconVuln   = circleIcon('#ef4444');

// ── Poll state ────────────────────────────────────────────────────────────────
// We diff-update the agent layer rather than clearing and re-adding every frame.
const agentMarkers = new Map(); // agentID -> L.marker

async function poll() {
  try {
    const resp = await fetch(STATE_URL, { signal: AbortSignal.timeout(2000) });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

    setOnline();
    updateStats(data);
    await loadRoads();  // no-op if already loaded

    const showAgents = document.getElementById('toggle-agents').checked;
    if (showAgents) updateAgents(data.agents || []);

  } catch (e) {
    setOffline();
  }
}

// ── Update stat cards ─────────────────────────────────────────────────────────
function updateStats(data) {
  document.getElementById('s-time').textContent    = data.simulationTime || '—';
  document.getElementById('s-step').textContent    = data.currentStep    || 0;
  document.getElementById('s-walking').textContent = data.walkingCount   || 0;
  document.getElementById('s-home').textContent    = data.atHomeCount    || 0;
  document.getElementById('s-dest').textContent    = data.atDestCount    || 0;
  const total = (data.agents || []).length;
  document.getElementById('s-total').textContent  = total;
}

// ── Diff-update agents (only move existing, add new, remove gone) ─────────────
function updateAgents(agents) {
  const incoming = new Set();

  for (const a of agents) {
    incoming.add(a.id);
    const icon = a.vulnerable ? iconVuln : iconNormal;

    if (agentMarkers.has(a.id)) {
      // Move existing marker — no DOM allocation
      agentMarkers.get(a.id).setLatLng([a.lat, a.lon]);
    } else {
      // New agent
      const m = L.marker([a.lat, a.lon], { icon, interactive: false })
        .addTo(agentLayer);
      agentMarkers.set(a.id, m);
    }
  }

  // Remove markers for agents that have left
  for (const [id, marker] of agentMarkers) {
    if (!incoming.has(id)) {
      agentLayer.removeLayer(marker);
      agentMarkers.delete(id);
    }
  }
}

// ── Start polling ─────────────────────────────────────────────────────────────
addLog('Dashboard started — connecting to simulation...');
let pollTimer = setInterval(poll, 2000);
poll(); // immediate first fetch
</script>
</body>
</html>
